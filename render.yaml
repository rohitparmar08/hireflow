services:
  # -------------------------------------------------------------
  # Backend API Web Service
  # -------------------------------------------------------------
  - type: web
    name: hireflow-backend
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate"
    startCommand: "gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120"
    healthCheckPath: /health/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.production
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com,localhost,127.0.0.1"
      - key: DATABASE_URL
        fromDatabase:
          name: hireflow-postgres
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: "https://hireflow-frontend.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: CSRF_TRUSTED_ORIGINS
        value: "https://hireflow-frontend.onrender.com,https://hireflow-backend.onrender.com"
      - key: DJANGO_SECURE_SSL_REDIRECT
        value: "True"
      - key: DJANGO_SESSION_COOKIE_SECURE
        value: "True"
      - key: DJANGO_CSRF_COOKIE_SECURE
        value: "True"
    disk:
      name: hireflow-media
      mountPath: /app/media
      sizeGB: 1

  # -------------------------------------------------------------
  # Frontend Static Site
  # -------------------------------------------------------------
  - type: web
    name: hireflow-frontend
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: "npm install && npm run build"
    staticPublishPath: ./dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        value: "https://hireflow-backend.onrender.com/api/v1"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

# ---------------------------------------------------------------
# Managed PostgreSQL Database
# ---------------------------------------------------------------
databases:
  - name: hireflow-postgres
    region: oregon
    plan: free
    databaseName: hireflow
    user: hireflow_user
