services:
  db:
    image: postgres:16-alpine
    container_name: hireflow-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hireflow}
      POSTGRES_USER: ${POSTGRES_USER:-hireflow_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hireflow_secure_db_pass_2026}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hireflow_user} -d ${POSTGRES_DB:-hireflow}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - hireflow-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hireflow-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.production
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-hireflow-production-secret-key-change-this-in-real-deployment-987654321}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend,frontend}
      DATABASE_URL: postgresql://${POSTGRES_USER:-hireflow_user}:${POSTGRES_PASSWORD:-hireflow_secure_db_pass_2026}@db:5432/${POSTGRES_DB:-hireflow}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost,http://localhost:3000,http://127.0.0.1:3000}
      DJANGO_SECURE_SSL_REDIRECT: "False"
      DJANGO_SESSION_COOKIE_SECURE: "False"
      DJANGO_CSRF_COOKIE_SECURE: "False"
    volumes:
      - media_data:/app/media
      - static_data:/app/staticfiles
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - hireflow-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: hireflow-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"
    networks:
      - hireflow-net

volumes:
  postgres_data:
  media_data:
  static_data:

networks:
  hireflow-net:
    driver: bridge
